<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BEATS</title>
        <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="css/bootstrap.min.css" crossorigin="anonymous">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/formulario.css">

    
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Coming+Soon&family=Honk&family=Poetsen+One&family=Satisfy&family=Sixtyfour:SCAN@-14&display=swap');
        </style>
    </head>
    <body>
        <div id="amiibos" class="px-5 pb-5 bg-danger">
            <div class="container">
                <div class="row">
                    <h2 class="text-center text-white text-shadow h1">BIENVENIDO A BEATS</h2>
                </div>
                <div class="form-container">
                    <div class="logo-container">
                        <img src="images/logo.jpeg" alt="Logo" class="logo">
                    </div>
                    <form class="formulario" id="miFormulario">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="inputUsername">Nombre de Usuario</label>
                                <input type="text" class="form-control" id="inputUsername" placeholder="Nombre de Usuario" aria-label="Nombre de Usuario">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="inputEmail4">Email</label>
                                <input type="email" class="form-control" id="inputEmail4" placeholder="Email" aria-label="Email">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="inputPassword4">Password</label>
                                <input type="password" class="form-control" id="inputPassword4" placeholder="Password" aria-label="Password">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gridCheck">
                                <label class="form-check-label" for="gridCheck">
                                    acepto los terminos y condiciones
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Sign in</button>
                    </form>

                    <script>
                        document.getElementById('miFormulario').addEventListener('submit', function (event) {
                            event.preventDefault(); // Evita el envío del formulario para validación

                            var usuario = document.getElementById('inputUsername').value;
                            var email = document.getElementById('inputEmail4').value;
                            var password = document.getElementById('inputPassword4').value;

                            if (usuario === 'BLURRYFACE' && email === 'deymarbrian02@gmail.com' && password === '12012005') {
                                alert('Datos correctos. Bienvenido, ' + usuario + '!');
                                window.location.href = 'Principal.html'; // Redirigir a otra página en caso de éxito
                            } else {
                                alert('Datos incorrectos. Por favor, inténtalo de nuevo.');
                            }
                        });
                    </script>
                </div>
            </div>
        </div>
    </body>
</html>
